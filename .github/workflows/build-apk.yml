name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Force update AGP version
        run: |
          sed -i "s/com.android.tools.build:gradle:8.7.3/com.android.tools.build:gradle:8.9.1/" android/build.gradle
          sed -i "s/com.android.tools.build:gradle:8.7.3/com.android.tools.build:gradle:8.9.1/" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auqab-tools-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
